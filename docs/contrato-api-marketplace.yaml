openapi: 3.0.3
info:
  title: Marketplace de alojamientos temporales - Contrato de API
  version: v1
  description: |
    Backend REST (Spring Boot). Autenticación con JWT (HS256) en el header `Authorization: Bearer <token>`.
    Todo endpoint no declarado aquí se deniega. Todas las respuestas de error usan el esquema `ApiError`
    e incluyen el header `X-Correlation-Id` (puede enviarse en la petición; si es un UUID válido se reutiliza).
    Fechas en formato ISO `yyyy-MM-dd`; instantes en ISO-8601 UTC.
servers:
  - url: http://localhost:8080
tags:
  - name: Autenticación y cuenta
  - name: Publicaciones (Anfitrión)
  - name: Periodos disponibles (Anfitrión)
  - name: Búsqueda (público)
  - name: Reservas (Huésped)
  - name: Reservas (Anfitrión)
  - name: Reseñas
  - name: Administración
  - name: Operación
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [Autenticación y cuenta]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { correo: anfitrion@marketplace.test, contrasena: "Test1234*" }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401':
          description: "Credenciales incorrectas (código `CREDENCIALES_INVALIDAS`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '403':
          description: "Cuenta no activa (código `CUENTA_RESTRINGIDA` o `CUENTA_DESACTIVADA`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/auth/me:
    get:
      tags: [Autenticación y cuenta]
      summary: Perfil del usuario autenticado
      responses:
        '200':
          description: Usuario actual
          content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: "Cuenta no activa (`CUENTA_RESTRINGIDA` / `CUENTA_DESACTIVADA`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/auth/registro:
    post:
      tags: [Autenticación y cuenta]
      summary: Registrarse como huésped o anfitrión
      description: |
        Crea la cuenta (estado ACTIVA) con el rol elegido. El correo se normaliza a minúsculas.
        Política de contraseña: 8 a 128 caracteres con mayúscula, minúscula, número y símbolo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroRequest' }
            example:
              nombre: Ana Pérez
              correo: ana@correo.com
              telefono: "3001234567"
              contrasena: "Segura123*"
              rol: ANFITRION
      responses:
        '201':
          description: Cuenta creada
          content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } }
        '400':
          description: |
            Datos inválidos (`SOLICITUD_INVALIDA`, con `detalles` por campo; incluye contraseña que no cumple la política)
            o rol no permitido (`ROL_NO_PERMITIDO`, p. ej. ADMINISTRADOR).
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "Correo ya registrado (`CORREO_YA_REGISTRADO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/auth/recuperar-contrasena:
    post:
      tags: [Autenticación y cuenta]
      summary: Solicitar enlace de recuperación (simulado)
      description: |
        Siempre responde 202, exista o no el correo (no revela cuentas). Si existe, se genera un enlace de un solo uso
        con vigencia de 30 minutos (configurable); se registra en log (`[CORREO SIMULADO]`), en la tabla
        `recuperacion_contrasena` (solo hash) y en auditoría. Una nueva solicitud invalida los enlaces anteriores.
        `enlaceSimulado` solo se devuelve con `app.recuperacion.exponer-enlace=true` (perfil dev).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecuperarContrasenaRequest' }
      responses:
        '202':
          description: Solicitud recibida
          content: { application/json: { schema: { $ref: '#/components/schemas/RecuperacionResponse' } } }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
  /api/auth/restablecer-contrasena:
    post:
      tags: [Autenticación y cuenta]
      summary: Definir nueva contraseña con el enlace
      description: "`token` es el valor del parámetro `?token=` del enlace. Tras el éxito el enlace deja de servir."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestablecerContrasenaRequest' }
      responses:
        '204': { description: Contraseña actualizada }
        '400':
          description: |
            Contraseña fuera de política (`SOLICITUD_INVALIDA`) o enlace inexistente, vencido o ya usado (`ENLACE_INVALIDO`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/anfitrion/servicios:
    get:
      tags: [Publicaciones (Anfitrión)]
      summary: Catálogo de servicios que se pueden marcar (ordenado por nombre)
      description: Rol ANFITRION. Los `id` se envían en `serviciosIds` al crear o editar una publicación.
      responses:
        '200':
          description: Servicios
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /api/anfitrion/politicas-cancelacion:
    get:
      tags: [Publicaciones (Anfitrión)]
      summary: Políticas de cancelación disponibles (ordenadas por nombre)
      description: Rol ANFITRION. El `id` se envía en `politicaCancelacionId`.
      responses:
        '200':
          description: Políticas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PoliticaCancelacion' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /api/anfitrion/publicaciones:
    get:
      tags: [Publicaciones (Anfitrión)]
      summary: Listar mis publicaciones (la más recientemente actualizada primero)
      description: Rol ANFITRION. Solo devuelve las publicaciones del usuario autenticado.
      responses:
        '200':
          description: Publicaciones propias
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PublicacionResumen' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Publicaciones (Anfitrión)]
      summary: Crear publicación
      description: Queda en estado BORRADOR y se audita (`PUBLICACION_CREADA`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicacionRequest' }
            example:
              politicaCancelacionId: 3f2b8c1e-5a4d-4e7a-9c3b-1d2e3f4a5b6c
              titulo: Apartamento con vista en Chapinero
              descripcion: Apartamento amplio y luminoso cerca de transporte.
              ciudad: Bogotá
              ubicacionTextual: Calle 60 # 10-20, Chapinero
              tipo: APARTAMENTO
              capacidad: 4
              precioNoche: 180000.00
              tarifaLimpieza: 30000.00
              reglas: No fumar. No fiestas.
              modoReserva: INMEDIATA
              serviciosIds: []
              serviciosAdicionales:
                - { nombre: Desayuno, costo: 15000.00 }
              imagenes: [ "https://ejemplo.com/foto1.jpg" ]
      responses:
        '201':
          description: Publicación creada en BORRADOR
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicacionDetalle' } } }
        '400':
          description: |
            `SOLICITUD_INVALIDA` (con `detalles` por campo), `POLITICA_CANCELACION_INVALIDA` o `SERVICIO_INVALIDO`
            (el id enviado no existe).
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /api/anfitrion/publicaciones/{publicacionId}:
    parameters:
      - $ref: '#/components/parameters/PublicacionId'
    get:
      tags: [Publicaciones (Anfitrión)]
      summary: Consultar una publicación propia
      description: Rol ANFITRION y dueño de la publicación.
      responses:
        '200':
          description: Detalle
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicacionDetalle' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/PublicacionNoEncontrada' }
    put:
      tags: [Publicaciones (Anfitrión)]
      summary: Editar publicación
      description: |
        Solo en estado BORRADOR, ACTIVA o PAUSADA. Los servicios adicionales y las imágenes se reemplazan completos
        en cada edición; el orden de las imágenes es el de la lista (la primera es la portada).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicacionRequest' } } }
      responses:
        '200':
          description: Publicación actualizada
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicacionDetalle' } } }
        '400':
          description: "`SOLICITUD_INVALIDA`, `POLITICA_CANCELACION_INVALIDA` o `SERVICIO_INVALIDO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/PublicacionNoEncontrada' }
        '409':
          description: "Estado que no permite editar (`ESTADO_PUBLICACION_INVALIDO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/anfitrion/publicaciones/{publicacionId}/enviar:
    parameters:
      - $ref: '#/components/parameters/PublicacionId'
    post:
      tags: [Publicaciones (Anfitrión)]
      summary: Enviar a revisión (BORRADOR a PENDIENTE_REVISION)
      description: Revalida los datos guardados antes de cambiar el estado. Se audita (`PUBLICACION_ENVIADA_REVISION`).
      responses:
        '200':
          description: Publicación en PENDIENTE_REVISION
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicacionDetalle' } } }
        '400':
          description: "Datos incompletos (`PUBLICACION_INCOMPLETA`, con `detalles` por campo)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/PublicacionNoEncontrada' }
        '409':
          description: "La publicación no está en BORRADOR (`ESTADO_PUBLICACION_INVALIDO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/anfitrion/publicaciones/{publicacionId}/periodos:
    parameters:
      - $ref: '#/components/parameters/PublicacionId'
    get:
      tags: [Periodos disponibles (Anfitrión)]
      summary: Listar periodos de una publicación (ordenados por fecha de inicio)
      description: Rol ANFITRION y dueño de la publicación.
      responses:
        '200':
          description: Periodos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Periodo' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/PublicacionNoEncontrada' }
    post:
      tags: [Periodos disponibles (Anfitrión)]
      summary: Registrar periodo disponible
      description: Rango inclusivo en ambos extremos. No puede empezar en el pasado (zona America/Bogota) ni cruzarse con otro periodo.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PeriodoRequest' } } }
      responses:
        '201':
          description: Periodo creado
          content: { application/json: { schema: { $ref: '#/components/schemas/Periodo' } } }
        '400':
          description: "Campos faltantes (`SOLICITUD_INVALIDA`) o fin anterior al inicio (`FECHAS_INVALIDAS`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/PublicacionNoEncontrada' }
        '409':
          description: "Se cruza con otro periodo (`PERIODO_CRUZADO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '422':
          description: "Empieza en el pasado (`PERIODO_EN_EL_PASADO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/anfitrion/publicaciones/{publicacionId}/periodos/{periodoId}:
    parameters:
      - $ref: '#/components/parameters/PublicacionId'
      - $ref: '#/components/parameters/PeriodoId'
    put:
      tags: [Periodos disponibles (Anfitrión)]
      summary: Editar periodo
      description: No se puede encoger el periodo dejando reservas activas fuera de él.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PeriodoRequest' } } }
      responses:
        '200':
          description: Periodo actualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/Periodo' } } }
        '400':
          description: "`SOLICITUD_INVALIDA` o `FECHAS_INVALIDAS`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`PUBLICACION_NO_ENCONTRADA` o `PERIODO_NO_ENCONTRADO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "`PERIODO_CRUZADO`, o `PERIODO_CON_RESERVAS` (en `detalles` viene la lista de reservas afectadas)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '422':
          description: "`PERIODO_EN_EL_PASADO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    delete:
      tags: [Periodos disponibles (Anfitrión)]
      summary: Eliminar periodo
      description: No se elimina si tiene reservas activas (estados PENDIENTE_PAGO, PENDIENTE_APROBACION, CONFIRMADA, EN_REVISION, COMPLETADA).
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`PUBLICACION_NO_ENCONTRADA` o `PERIODO_NO_ENCONTRADO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "`PERIODO_CON_RESERVAS`; `detalles` es un arreglo de `ReservaResumen`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/servicios:
    get:
      tags: [Búsqueda (público)]
      summary: "PROPUESTA. Catálogo público de servicios (ordenado por nombre)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Público, sin autenticación. Mismo catálogo que `GET /api/anfitrion/servicios`, que se
        mantiene igual para el formulario del anfitrión; este existe para que la búsqueda pueda
        mostrar los nombres del filtro `serviciosIds` a visitantes y huéspedes.
      security: []
      responses:
        '200':
          description: Servicios
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
  /api/alojamientos:
    get:
      tags: [Búsqueda (público)]
      summary: "PROPUESTA. Buscar alojamientos activos con filtros"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Público, sin autenticación. Solo publicaciones en ACTIVA. Todos los filtros son
        opcionales y se combinan con Y. Con `fechaLlegada` y `fechaSalida` devuelve solo
        las que tengan un periodo disponible que cubra todo el rango y sin reservas activas encima.
      security: []
      parameters:
        - { name: ciudad, in: query, schema: { type: string, maxLength: 80 } }
        - { name: fechaLlegada, in: query, schema: { type: string, format: date } }
        - { name: fechaSalida, in: query, schema: { type: string, format: date, description: Exclusiva, es el día de salida. } }
        - { name: huespedes, in: query, schema: { type: integer, minimum: 1 } }
        - { name: precioMin, in: query, schema: { type: number, minimum: 0 } }
        - { name: precioMax, in: query, schema: { type: number, minimum: 0 } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoAlojamiento' } }
        - { name: serviciosIds, in: query, style: form, explode: false, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200':
          description: Resultados paginados
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginaAlojamientos' } } }
        '400':
          description: "`FECHAS_INVALIDAS` si la salida no es posterior a la llegada, o `SOLICITUD_INVALIDA`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/alojamientos/{alojamientoId}:
    parameters:
      - $ref: '#/components/parameters/AlojamientoId'
    get:
      tags: [Búsqueda (público)]
      summary: "PROPUESTA. Detalle de un alojamiento activo"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Público. Solo devuelve publicaciones en ACTIVA; en cualquier otro estado responde 404,
        para no revelar que existe.
      security: []
      responses:
        '200':
          description: Detalle público
          content: { application/json: { schema: { $ref: '#/components/schemas/AlojamientoDetalle' } } }
        '404':
          description: "`ALOJAMIENTO_NO_ENCONTRADO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/alojamientos/{alojamientoId}/calendario:
    parameters:
      - $ref: '#/components/parameters/AlojamientoId'
    get:
      tags: [Búsqueda (público)]
      summary: "PROPUESTA. Calendario de disponibilidad"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Público. Un elemento por día del rango pedido. Un día está disponible si cae dentro
        de un periodo del anfitrión y no lo ocupa una reserva activa. Máximo 365 días por consulta.
      security: []
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Días del rango
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DiaCalendario' } }
        '400':
          description: "`FECHAS_INVALIDAS` o rango mayor de 365 días (`RANGO_EXCESIVO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: "`ALOJAMIENTO_NO_ENCONTRADO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/huesped/cotizaciones:
    post:
      tags: [Reservas (Huésped)]
      summary: "PROPUESTA. Cotizar una estadía"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol HUESPED. No reserva ni bloquea nada: solo calcula. El desglose lo calcula el
        backend, nunca el frontend, para que el total que se muestra sea el que se cobra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CotizacionRequest' }
            example:
              alojamientoId: 11111111-1111-4111-8111-111111111111
              fechaLlegada: '2026-12-10'
              fechaSalida: '2026-12-14'
              numeroHuespedes: 3
      responses:
        '200':
          description: Desglose del precio
          content: { application/json: { schema: { $ref: '#/components/schemas/Cotizacion' } } }
        '400':
          description: "`SOLICITUD_INVALIDA` o `FECHAS_INVALIDAS`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`ALOJAMIENTO_NO_ENCONTRADO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "Las fechas no están libres (`PERIODO_NO_DISPONIBLE`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '422':
          description: "Más huéspedes que la capacidad (`CAPACIDAD_EXCEDIDA`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/huesped/reservas:
    get:
      tags: [Reservas (Huésped)]
      summary: "PROPUESTA. Mis reservas"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol HUESPED. Solo las del usuario autenticado, de la llegada más reciente a la más antigua.
      parameters:
        - { name: estado, in: query, required: false, schema: { $ref: '#/components/schemas/EstadoReserva' } }
      responses:
        '200':
          description: Reservas propias
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReservaResumen' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Reservas (Huésped)]
      summary: "PROPUESTA. Crear una reserva"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol HUESPED. La cabecera `Idempotency-Key` evita que un doble clic o un reintento
        creen dos reservas: con la misma clave y el mismo cuerpo devuelve la reserva ya creada,
        con 200 en vez de 201. En modo INMEDIATA queda PENDIENTE_PAGO; en CON_APROBACION,
        PENDIENTE_APROBACION. El backend recalcula el precio, no se fía del que mande el cliente.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReservaRequest' } } }
      responses:
        '201':
          description: Reserva creada
          content: { application/json: { schema: { $ref: '#/components/schemas/Reserva' } } }
        '200':
          description: Ya existía con esa clave de idempotencia
          content: { application/json: { schema: { $ref: '#/components/schemas/Reserva' } } }
        '400':
          description: "`SOLICITUD_INVALIDA`, `FECHAS_INVALIDAS` o falta la cabecera (`IDEMPOTENCIA_REQUERIDA`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`ALOJAMIENTO_NO_ENCONTRADO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "Alguien reservó antes (`PERIODO_NO_DISPONIBLE`), o misma clave con distinto cuerpo (`IDEMPOTENCIA_CONFLICTO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '422':
          description: "`CAPACIDAD_EXCEDIDA`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/huesped/reservas/{reservaId}:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    get:
      tags: [Reservas (Huésped)]
      summary: "PROPUESTA. Detalle de una reserva propia"
      description: Propuesta del frontend, pendiente de implementar y confirmar por backend. Rol HUESPED y dueño de la reserva.
      responses:
        '200':
          description: Detalle
          content: { application/json: { schema: { $ref: '#/components/schemas/Reserva' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`RESERVA_NO_ENCONTRADA`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/huesped/reservas/{reservaId}/pago:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    post:
      tags: [Reservas (Huésped)]
      summary: "PROPUESTA. Pagar la reserva (saga del ADR-004)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Sigue el ADR-004: el backend ejecuta el cobro contra Stripe en modo de prueba con
        timeout de 10 s y circuit breaker (Resilience4j, ADR-015), y responde dentro de los 12 s.
        El frontend no habla con Stripe ni maneja datos de tarjeta: solo dispara el pago y
        muestra el desenlace.

        Cuatro desenlaces, cada uno con su código:
        200 el cobro se aprobó y la reserva queda CONFIRMADA;
        402 el cobro falló o expiró, se ejecutó la compensación, la reserva queda PAGO_FALLIDO
        y el periodo vuelve a estar libre, así que la pantalla debe invitar a buscar de nuevo;
        202 el resultado es incierto (PAGO_INCIERTO) y lo resolverá la conciliación, así que la
        pantalla pide esperar y consultar la reserva más tarde, sin reintentar el cobro;
        503 el circuit breaker está abierto y Stripe no está disponible, se puede reintentar luego.

        La cabecera `Idempotency-Key` es la misma clave con la que la conciliación consulta el
        pago, así que un reintento no cobra dos veces.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        description: Solo para la demostración y las pruebas con WireMock, para forzar cada desenlace.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PagoRequest' }
      responses:
        '200':
          description: Pago aprobado, reserva CONFIRMADA
          content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoPago' } } }
        '202':
          description: "Resultado incierto (`PAGO_INCIERTO`); la conciliación lo resolverá"
          content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoPago' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '402':
          description: "Cobro rechazado o expirado (`PAGO_RECHAZADO`). La reserva pasó a PAGO_FALLIDO y el periodo quedó libre."
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`RESERVA_NO_ENCONTRADA`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "La reserva no está en PENDIENTE_PAGO (`ESTADO_RESERVA_INVALIDO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '503':
          description: "Circuit breaker abierto (`SERVICIO_PAGOS_NO_DISPONIBLE`); se puede reintentar más tarde"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/admin/configuracion/tarifa-servicio:
    get:
      tags: [Administración]
      summary: "PROPUESTA. Consultar la tarifa de servicio"
      description: Propuesta del frontend, pendiente de implementar y confirmar por backend. Rol ADMINISTRADOR.
      responses:
        '200':
          description: Tarifa vigente
          content: { application/json: { schema: { $ref: '#/components/schemas/TarifaServicio' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    put:
      tags: [Administración]
      summary: "PROPUESTA. Cambiar la tarifa de servicio"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol ADMINISTRADOR. Afecta solo a las cotizaciones y reservas nuevas; las ya creadas
        conservan la tarifa con la que se calcularon. Se audita (`TARIFA_SERVICIO_CAMBIADA`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TarifaServicio' } } }
      responses:
        '200':
          description: Tarifa actualizada
          content: { application/json: { schema: { $ref: '#/components/schemas/TarifaServicio' } } }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /api/anfitrion/reservas:
    get:
      tags: [Reservas (Anfitrión)]
      summary: "PROPUESTA. Reservas de mis publicaciones (SCRUM-50)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol ANFITRION. Solo reservas sobre publicaciones propias. Sin `estado` devuelve
        las que están en PENDIENTE_APROBACION, que son las que esperan una decisión,
        de la más antigua a la más reciente.
      parameters:
        - { name: estado, in: query, required: false, schema: { $ref: '#/components/schemas/EstadoReserva' } }
      responses:
        '200':
          description: Reservas sobre mis publicaciones
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReservaAnfitrion' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /api/anfitrion/reservas/{reservaId}/aprobar:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    post:
      tags: [Reservas (Anfitrión)]
      summary: "PROPUESTA. Aprobar una reserva (SCRUM-50)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol ANFITRION y dueño de la publicación. Solo desde PENDIENTE_APROBACION.
        La reserva pasa a PENDIENTE_PAGO y el huésped puede pagar. Se audita.
      responses:
        '200':
          description: Reserva aprobada, queda en PENDIENTE_PAGO
          content: { application/json: { schema: { $ref: '#/components/schemas/ReservaAnfitrion' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`RESERVA_NO_ENCONTRADA`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "No está en PENDIENTE_APROBACION (`ESTADO_RESERVA_INVALIDO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/anfitrion/reservas/{reservaId}/rechazar:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    post:
      tags: [Reservas (Anfitrión)]
      summary: "PROPUESTA. Rechazar una reserva (SCRUM-50)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol ANFITRION y dueño. Solo desde PENDIENTE_APROBACION. La reserva pasa a
        CANCELADA, el periodo vuelve a quedar libre y el motivo se guarda para el huésped.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RechazoRequest' } } }
      responses:
        '200':
          description: Reserva rechazada y periodo liberado
          content: { application/json: { schema: { $ref: '#/components/schemas/ReservaAnfitrion' } } }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`RESERVA_NO_ENCONTRADA`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "`ESTADO_RESERVA_INVALIDO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/huesped/reservas/{reservaId}/cancelacion:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    get:
      tags: [Reservas (Huésped)]
      summary: "PROPUESTA. Qué pasa si cancelo ahora (SCRUM-51)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol HUESPED y dueño. No cancela nada: calcula qué devolución correspondería
        si se cancelara en este momento, aplicando la política de la publicación.
        La pantalla lo muestra antes de que la persona confirme, para que sepa
        cuánto pierde.
      responses:
        '200':
          description: Previsualización de la cancelación
          content: { application/json: { schema: { $ref: '#/components/schemas/PrevisualizacionCancelacion' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`RESERVA_NO_ENCONTRADA`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "La reserva ya no se puede cancelar (`ESTADO_RESERVA_INVALIDO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/huesped/reservas/{reservaId}/cancelar:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    post:
      tags: [Reservas (Huésped)]
      summary: "PROPUESTA. Cancelar una reserva (SCRUM-51)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol HUESPED y dueño. Cancelable desde PENDIENTE_PAGO, PENDIENTE_APROBACION
        y CONFIRMADA. La reserva pasa a CANCELADA, el periodo se libera y, si había
        cobro, se reembolsa la parte que marque la política (el pago pasa a REEMBOLSADO).
        El importe devuelto es el que calculó la previsualización, salvo que haya
        cambiado de tramo entre tanto.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/CancelacionRequest' } } }
      responses:
        '200':
          description: Reserva cancelada
          content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoCancelacion' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`RESERVA_NO_ENCONTRADA`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "Ya cancelada, completada o en curso (`ESTADO_RESERVA_INVALIDO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/huesped/reservas/{reservaId}/resena:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    post:
      tags: [Reseñas]
      summary: "PROPUESTA. Calificar y reseñar una estadía (SCRUM-54)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol HUESPED y dueño de la reserva. Solo sobre reservas COMPLETADA y una sola
        vez por reserva, que es lo que garantiza que quien reseña se alojó de verdad.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResenaRequest' } } }
      responses:
        '201':
          description: Reseña publicada
          content: { application/json: { schema: { $ref: '#/components/schemas/Resena' } } }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404':
          description: "`RESERVA_NO_ENCONTRADA`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: "La reserva no está COMPLETADA (`ESTADO_RESERVA_INVALIDO`) o ya tiene reseña (`RESENA_YA_EXISTE`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/alojamientos/{alojamientoId}/resenas:
    parameters:
      - $ref: '#/components/parameters/AlojamientoId'
    get:
      tags: [Reseñas]
      summary: "PROPUESTA. Reseñas de un alojamiento (SCRUM-57)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Público, sin autenticación. De la más reciente a la más antigua. No incluye
        las reseñas ocultadas por un administrador.
      security: []
      parameters:
        - { name: pagina, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Reseñas paginadas
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginaResenas' } } }
        '404':
          description: "`ALOJAMIENTO_NO_ENCONTRADO`"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/admin/publicaciones:
    get:
      tags: [Administración]
      summary: "PROPUESTA. Listar publicaciones para revisión"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol ADMINISTRADOR. Sin `estado` devuelve las que están en PENDIENTE_REVISION,
        de la más antigua a la más reciente para atender por orden de llegada.
      parameters:
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoPublicacion' }
      responses:
        '200':
          description: Publicaciones por revisar
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PublicacionRevision' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /api/admin/publicaciones/{publicacionId}:
    parameters:
      - $ref: '#/components/parameters/PublicacionId'
    get:
      tags: [Administración]
      summary: "PROPUESTA. Ver una publicación completa para decidir"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol ADMINISTRADOR. Devuelve el mismo detalle que ve el anfitrión, en cualquier estado.
      responses:
        '200':
          description: Detalle
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicacionDetalle' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/PublicacionNoEncontrada' }
  /api/admin/publicaciones/{publicacionId}/aprobar:
    parameters:
      - $ref: '#/components/parameters/PublicacionId'
    post:
      tags: [Administración]
      summary: "PROPUESTA. Aprobar (PENDIENTE_REVISION a ACTIVA)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol ADMINISTRADOR. Sin cuerpo. Deja `motivoEstado` en nulo y se audita
        (`PUBLICACION_APROBADA`). Desde ACTIVA la publicación ya es visible en la búsqueda.
      responses:
        '200':
          description: Publicación activa
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicacionDetalle' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/PublicacionNoEncontrada' }
        '409':
          description: "No está en PENDIENTE_REVISION (`ESTADO_PUBLICACION_INVALIDO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/admin/publicaciones/{publicacionId}/rechazar:
    parameters:
      - $ref: '#/components/parameters/PublicacionId'
    post:
      tags: [Administración]
      summary: "PROPUESTA. Rechazar (PENDIENTE_REVISION a BORRADOR)"
      description: |
        Propuesta del frontend, pendiente de implementar y confirmar por backend.
        Rol ADMINISTRADOR. Vuelve a BORRADOR para que el anfitrión corrija y la reenvíe;
        el motivo queda en `motivoEstado` y se audita (`PUBLICACION_RECHAZADA`).
        No se usa un estado RECHAZADA para no ampliar el enum existente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RechazoRequest' }
            example: { motivo: "Las fotos no corresponden al alojamiento descrito." }
      responses:
        '200':
          description: Publicación devuelta a borrador
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicacionDetalle' } } }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/PublicacionNoEncontrada' }
        '409':
          description: "No está en PENDIENTE_REVISION (`ESTADO_PUBLICACION_INVALIDO`)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /api/admin/estado:
    get:
      tags: [Administración]
      summary: Verificación temporal de rol ADMINISTRADOR
      description: Endpoint temporal para probar 403 + auditoría `ACCESO_DENEGADO`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { estado: { type: string, example: ok } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /actuator/health:
    get:
      tags: [Operación]
      summary: Salud del servicio
      security: []
      responses:
        '200': { description: UP }
        '503': { description: DOWN }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PublicacionId:
      name: publicacionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlojamientoId:
      name: alojamientoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReservaId:
      name: reservaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PeriodoId:
      name: periodoId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    SolicitudInvalida:
      description: "Cuerpo inválido (`SOLICITUD_INVALIDA`; `detalles` lista campo y mensaje)"
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NoAutenticado:
      description: "Falta token o es inválido/vencido (`NO_AUTENTICADO`)"
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Prohibido:
      description: "Rol insuficiente o la publicación no es del usuario (`ACCESO_DENEGADO`); queda en auditoría"
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    PublicacionNoEncontrada:
      description: "`PUBLICACION_NO_ENCONTRADA`"
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiError:
      type: object
      description: |
        Formato único de error. Otros códigos genéricos: `RECURSO_NO_ENCONTRADO` (404), `METODO_NO_PERMITIDO` (405),
        `TIPO_CONTENIDO_NO_SOPORTADO` (415), `ERROR_INTERNO` (500).
      properties:
        codigo: { type: string, example: CORREO_YA_REGISTRADO }
        mensaje: { type: string }
        detalles:
          description: Lista de `DetalleCampo` en validaciones, lista de `ReservaResumen` en `PERIODO_CON_RESERVAS`; omitido si no aplica.
        correlationId: { type: string, format: uuid }
      required: [codigo, mensaje]
    DetalleCampo:
      type: object
      properties:
        campo: { type: string, example: contrasena }
        mensaje: { type: string }
    EstadoReserva:
      type: string
      enum: [PENDIENTE_PAGO, PENDIENTE_APROBACION, CONFIRMADA, EN_REVISION, COMPLETADA, CANCELADA, PAGO_FALLIDO]
    ReservaResumen:
      type: object
      description: "En `PERIODO_CON_RESERVAS` va sin los campos de alojamiento; en el listado de mis reservas, con ellos."
      properties:
        id: { type: string, format: uuid }
        fechaLlegada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        numeroHuespedes: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoReserva' }
        alojamientoId: { type: string, format: uuid }
        alojamientoTitulo: { type: string }
        alojamientoCiudad: { type: string }
        imagenPortada: { type: string, nullable: true }
        total: { type: number }
    Rol:
      type: string
      enum: [HUESPED, ANFITRION, ADMINISTRADOR]
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string, format: email }
        rol: { $ref: '#/components/schemas/Rol' }
    LoginRequest:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email, maxLength: 160 }
        contrasena: { type: string, maxLength: 128 }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        tipo: { type: string, example: Bearer }
        expiraEn: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/Usuario' }
    RegistroRequest:
      type: object
      required: [nombre, correo, contrasena, rol]
      properties:
        nombre: { type: string, maxLength: 120 }
        correo: { type: string, format: email, maxLength: 160 }
        telefono: { type: string, maxLength: 30 }
        contrasena:
